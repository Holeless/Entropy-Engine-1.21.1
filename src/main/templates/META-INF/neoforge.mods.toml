# NeoForge mod metadata. ${...} values are filled in from gradle.properties by the generateModMetadata task.
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional
#logoFile="examplemod.png" #optional
#credits="" #optional
#authors=""

description='''
Curses lets you choose world-wide curses when creating a new world.
Each curse changes how the whole world behaves. Currently available: Famine, Quick Fuse, Deluge and Hypocrisy.
'''

# Mixin config (used by Hypocrisy so piglins keep the Totem of Undying in their off hand)
[[mixins]]
config="${mod_id}.mixins.json"

# Access transformers are loaded from META-INF/accesstransformer.cfg automatically.

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
